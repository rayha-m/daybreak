# Runs Daybreak on GitHub's servers for free. You don't need your laptop on.
#
# GitHub schedules use UTC and are sometimes late, so instead of one exact
# time we wake up every 15 minutes around your morning and evening, and the
# script itself decides whether it's time to send (and never sends twice a day).
# That also handles daylight saving time automatically.

name: Daybreak

on:
  schedule:
    - cron: "7,22,37,52 11-14 * * *"   # mornings: ~5-10 AM Central
    - cron: "7,37 1-3 * * *"           # evenings: ~7-10:30 PM Central
  workflow_dispatch:                    # adds a "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: "What to send"
        type: choice
        options: [morning, evening, auto]
        default: morning

permissions:
  contents: write          # lets the workflow save state.json back to the repo

concurrency:
  group: daybreak          # never run two at once (they'd fight over state.json)
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CALENDAR_ICS: ${{ secrets.GOOGLE_CALENDAR_ICS }}
          CANVAS_ICS: ${{ secrets.CANVAS_ICS }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" != "auto" ]; then
            python main.py send "${{ inputs.mode }}"
          else
            python main.py auto
          fi

      - name: Save progress (state.json)
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "daybreak-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update Daybreak state [skip ci]"
            git push
          fi
